<title>AIVIS OS Plugin Screens</title>
<style>
  /* WordPress admin is the design system this plugin has to live inside, so
     these are wp-admin's own tokens rather than an invented palette. Committed
     to light: wp-admin has no dark mode, and a half-adapted one would read as
     a different product. Every colour is painted explicitly so the page holds
     on any host ground. */
  :root{
    --wp-bg:#f0f0f1; --wp-surface:#fff; --wp-menu:#1d2327; --wp-menu-hi:#2c3338;
    --wp-text:#1d2327; --wp-text-2:#50575e; --wp-text-3:#787c82;
    --wp-line:#c3c4c7; --wp-line-2:#dcdcde;
    --wp-blue:#2271b1; --wp-blue-hi:#135e96; --wp-blue-soft:#f0f6fc;
    --wp-green:#00a32a; --wp-amber:#dba617; --wp-red:#d63638; --wp-grey:#8c8f94;
    --wp-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;
    --wp-mono:Menlo,Consolas,monaco,monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--wp-bg);color:var(--wp-text);font-family:var(--wp-font);font-size:13px;line-height:1.5}
  a{color:var(--wp-blue);text-decoration:none}
  a:hover{color:var(--wp-blue-hi);text-decoration:underline}
  :focus-visible{outline:2px solid var(--wp-blue);outline-offset:1px}

  /* ── shell ─────────────────────────────────────────────── */
  .shell{display:grid;grid-template-columns:160px 1fr;min-height:640px}
  .adminmenu{background:var(--wp-menu);padding-top:8px}
  .adminmenu ul{list-style:none;margin:0;padding:0}
  .adminmenu li a{display:flex;gap:8px;align-items:center;color:#f0f0f1;padding:8px 10px;font-size:13px}
  .adminmenu li a:hover{background:var(--wp-menu-hi);color:#72aee6;text-decoration:none}
  .adminmenu li.current > a{background:var(--wp-blue);color:#fff;font-weight:600}
  .adminmenu .ico{width:18px;text-align:center;opacity:.85;font-size:13px}
  .adminmenu .sep{height:1px;background:#3c434a;margin:8px 0}
  .submenu{background:#2c3338}
  .submenu a{padding-left:34px!important;font-size:12.5px;color:#c3c4c7}
  .submenu li.current a{color:#fff;font-weight:600;background:transparent}

  .content{padding:10px 20px 40px;min-width:0}
  .wrap{max-width:1120px}
  h1.wp-heading{font-size:23px;font-weight:400;margin:16px 0 4px;line-height:1.3}
  .subtitle{color:var(--wp-text-2);margin:0 0 12px;font-size:13px}

  .nav-tab-wrapper{border-bottom:1px solid var(--wp-line);margin:16px 0 0;padding-left:0;display:flex;gap:4px}
  .nav-tab{background:#dcdcde;border:1px solid var(--wp-line);border-bottom:none;color:var(--wp-text-2);
           padding:7px 12px;font-size:14px;cursor:pointer;margin-bottom:-1px;line-height:1.7;font-family:inherit}
  .nav-tab:hover{background:#f6f7f7;color:var(--wp-text)}
  .nav-tab-active,.nav-tab-active:hover{background:var(--wp-bg);border-bottom:1px solid var(--wp-bg);color:var(--wp-text)}

  /* ── postboxes ─────────────────────────────────────────── */
  .postbox{background:var(--wp-surface);border:1px solid var(--wp-line-2);box-shadow:0 1px 1px rgba(0,0,0,.04);margin-top:16px}
  .postbox h2{font-size:14px;font-weight:600;padding:10px 12px;margin:0;border-bottom:1px solid var(--wp-line-2);
              display:flex;align-items:center;justify-content:space-between;gap:10px}
  .inside{padding:12px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.cols{grid-template-columns:1fr}.shell{grid-template-columns:44px 1fr}
    .adminmenu li a span:not(.ico){display:none}.submenu{display:none}}

  /* ── notices ───────────────────────────────────────────── */
  .notice{background:#fff;border-left:4px solid var(--wp-blue);box-shadow:0 1px 1px rgba(0,0,0,.04);
          padding:10px 12px;margin:14px 0 0}
  .notice p{margin:0}
  .notice p + p{margin-top:6px}
  .notice-success{border-left-color:var(--wp-green)}
  .notice-warning{border-left-color:var(--wp-amber)}
  .notice-error{border-left-color:var(--wp-red)}
  .notice strong{font-weight:600}

  /* ── forms ─────────────────────────────────────────────── */
  table.form-table{width:100%;border-collapse:collapse}
  table.form-table th{width:210px;text-align:left;vertical-align:top;padding:16px 10px 16px 0;font-weight:600;font-size:14px}
  table.form-table td{padding:14px 0;vertical-align:top}
  .description{color:var(--wp-text-2);font-size:13px;margin:6px 0 0;max-width:62ch}
  input[type=text],input[type=password],select{border:1px solid #8c8f94;border-radius:3px;padding:5px 8px;
    font-size:14px;font-family:inherit;color:var(--wp-text);background:#fff;min-height:30px}
  input[type=text],input[type=password]{width:100%;max-width:400px}
  input:disabled{background:#f0f0f1;color:var(--wp-text-3)}
  .button{background:#f6f7f7;border:1px solid #2271b1;color:#2271b1;border-radius:3px;padding:4px 10px;
    font-size:13px;cursor:pointer;font-family:inherit;line-height:2;white-space:nowrap}
  .button:hover{background:#f0f0f1;border-color:#0a4b78;color:#0a4b78}
  .button-primary{background:var(--wp-blue);border-color:var(--wp-blue);color:#fff}
  .button-primary:hover{background:var(--wp-blue-hi);border-color:var(--wp-blue-hi);color:#fff}
  .button-small{padding:1px 8px;font-size:12px;line-height:1.9}
  .button:disabled{opacity:.5;cursor:not-allowed}
  label.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;max-width:62ch}
  label.check input{margin-top:3px}

  /* ── state chips ───────────────────────────────────────── */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:9px;
        border:1px solid;white-space:nowrap;font-weight:500}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .c-active{color:#0a6b22;border-color:#7ad03a;background:#edfaef}
  .c-stale{color:#8a6100;border-color:#f0c33c;background:#fdf6e3}
  .c-hold{color:#0a4b78;border-color:#72aee6;background:var(--wp-blue-soft)}
  .c-susp{color:#a02226;border-color:#e6a5a6;background:#fcf0f1}
  .c-retired{color:#50575e;border-color:var(--wp-line);background:#f6f7f7}

  /* ── stat tiles ────────────────────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--wp-line-2)}
  .tile{background:#fff;padding:12px}
  .tile .n{font-size:26px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
  .tile .l{font-size:12px;color:var(--wp-text-2);margin-top:3px}
  .tile.warn .n{color:var(--wp-amber)} .tile.bad .n{color:var(--wp-red)} .tile.ok .n{color:var(--wp-green)}

  /* ── list table ────────────────────────────────────────── */
  table.wp-list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--wp-line-2);margin-top:16px}
  table.wp-list th{text-align:left;font-size:13px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--wp-line-2);
                   background:#fff}
  table.wp-list td{padding:9px 10px;border-bottom:1px solid #f0f0f1;vertical-align:top;font-size:13px}
  table.wp-list tr:last-child td{border-bottom:none}
  table.wp-list tr:hover td{background:#f6f7f7}
  .url{font-family:var(--wp-mono);font-size:12.5px;word-break:break-all}
  .muted{color:var(--wp-text-3)}
  .row-actions{visibility:hidden;font-size:12px;margin-top:3px;color:var(--wp-text-3)}
  tr:hover .row-actions{visibility:visible}
  .row-actions button{background:none;border:none;color:var(--wp-blue);cursor:pointer;padding:0;font-size:12px;font-family:inherit}
  .row-actions button:hover{color:var(--wp-blue-hi);text-decoration:underline}
  .row-actions .sepr{color:var(--wp-line)}
  .num{font-variant-numeric:tabular-nums}
  .scrollx{overflow-x:auto}

  code{font-family:var(--wp-mono);font-size:12.5px;background:#f0f0f1;padding:1px 5px;border-radius:2px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:baseline}
  .kv dt{color:var(--wp-text-2)} .kv dd{margin:0;font-weight:500}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--wp-text-2);padding:10px 12px;
          border-top:1px solid var(--wp-line-2);background:#fbfbfc}
  .legend span{display:flex;gap:6px;align-items:center}

  /* WordPress's widefat table, for the Languages & chains box */
  table.widefat{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--wp-line-2);margin-top:12px;font-size:13px}
  table.widefat th{text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--wp-line-2)}
  table.widefat td{padding:9px 10px;border-bottom:1px solid #f0f0f1;vertical-align:top}
  table.widefat.striped tbody tr:nth-child(odd) td{background:#f6f7f7}
  table.widefat select{min-height:28px;font-size:13px}

  /* ── list table chrome (Pages screen) ──────────────────── */
  .subsubsub{list-style:none;margin:8px 0;padding:0;font-size:13px;color:var(--wp-text-3)}
  .subsubsub li{display:inline}
  .subsubsub a{padding:0 2px}.subsubsub a.current{color:var(--wp-text);font-weight:600}
  .subsubsub .count{color:var(--wp-text-3);font-weight:400}
  .search-box{float:right;margin:0 0 8px;display:flex;gap:6px}
  .search-box input{width:220px;max-width:none}
  .tablenav{clear:both;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
  .tablenav .actions{display:flex;gap:6px;align-items:center}
  .tablenav-pages{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--wp-text-2)}
  .tablenav-pages .pagination-links{display:flex;gap:4px;align-items:center}
  .tablenav-pages .button{padding:0 8px;line-height:1.9;min-width:26px;text-align:center}
  .tablenav-pages .button.disabled{opacity:.45;pointer-events:none}
  .paging-input{padding:0 6px}
  .pages-table th.check-column,.pages-table td.check-column{width:24px;padding:9px 6px}
  .pages-table th a{color:var(--wp-text);text-decoration:none}.sort-ind{font-size:9px;color:var(--wp-text-3)}
  .pages-table .col-page{width:38%}
  .tiles a.tile{text-decoration:none;color:inherit}.tiles a.tile:hover{background:#f6f7f7}
  .chip.ok{color:#0a6b22;border-color:#7ad03a;background:#edfaef}.chip.bad{color:#a02226;border-color:#e6a5a6;background:#fcf0f1}

  /* ── prototype-only control ────────────────────────────── */
  .proto{background:#1d2327;color:#c3c4c7;padding:8px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
         font-size:12px}
  .proto strong{color:#fff;font-weight:600;letter-spacing:.02em}
  .proto select{background:#2c3338;color:#f0f0f1;border-color:#3c434a;font-size:12px;min-height:26px;padding:2px 6px}
  .proto .hint{color:#8c8f94}
</style>

<div class="proto">

  <select id="stateSelect" aria-label="Preview state">
    <option value="healthy">Connected and syncing</option>

</div>

<div class="shell">
  <nav class="adminmenu" aria-label="WordPress admin menu">
    <ul>
      <li><a href="#"><span class="ico">⌂</span><span>Dashboard</span></a></li>

<script>
/* ────────────────────────────────────────────────────────────
   Prototype state. The shapes mirror the API envelope and the
   inventory row so this maps 1:1 onto what src/Admin will render.
   ──────────────────────────────────────────────────────────── */
const SITE_HOST = 'example.com';

const BUSINESSES = [
  { id:'biz_live',    name:'Example GmbH',            baseUrl:'https://example.com',      chainCount:2, createdAt:'2026-03-01', industry:'General' },
  { id:'biz_rebuild', name:'Example GmbH (rebuild)',  baseUrl:'https://example.com',      chainCount:1, createdAt:'2026-08-20', industry:'General' },
  { id:'biz_other',   name:'Anderer Kunde AG',        baseUrl:'https://andere-domain.de', chainCount:1, createdAt:'2026-04-11', industry:'General' },
];

const CHAINS = [
  { id:'chain_core', name:'Structural core', state:'ready',        kg:true,  urlCount:114, step:9, lang:'de', hint:'de' },
  { id:'chain_edit', name:'Editorial',       state:'re_ingesting', kg:true,  urlCount:57, step:9, lang:'de', hint:'de' },
  { id:'chain_en',   name:'English site',    state:'ready',        kg:true,  urlCount:43, step:9, lang:'en', hint:'en' },
];
// §07a — one chain per language. Languages come from the active translation
// plugin (WPML here); core alone has exactly one.
const LANGS = [
  { code:'de', name:'Deutsch', def:true },
  { code:'en', name:'English', def:false },
  { code:'fr', name:'Français', def:false },
];
const PROVIDER = 'WPML';

const baseUrls = () => ([
  { url:'https://example.com/',                 lang:'de', layer:'structural_core', chain:'Structural core', state:'active',  generated:'1 Sep 2026, 12:00', note:'' },
  { url:'https://example.com/services/',        lang:'de', layer:'editorial',       chain:'Editorial',       state:'active',  generated:'4 Sep 2026, 12:00', note:'' },
  { url:'https://example.com/ueber-uns/',       lang:'de', layer:'structural_core', chain:'Structural core', state:'stale',   generated:'20 Aug 2026, 09:14', note:'Source page changed after generation — still served' },
  { url:'https://example.com/kontakt/',         lang:'de', layer:'structural_core', chain:'Structural core', state:'hold',    generated:'—',                  note:'Not generated yet in AIVIS — nothing injected, nothing removed' },
  { url:'https://example.com/altes-angebot/',   lang:'de', layer:'editorial',       chain:'Editorial',       state:'active',  generated:'15 Aug 2026, 10:00', note:'' },
  { url:'https://example.com/alte-aktion/',     lang:'de', layer:'editorial',       chain:'Editorial',       state:'retired', generated:'2 Jul 2026, 08:30',  note:'Absent from two authoritative syncs — kept 24 more days for rollback' },
]);

const STATE_HINTS = {
  healthy:'the ordinary case',
  unconfigured:'first run, before a token is entered',
  ambiguous:'the duplicate-onboarding case — AC-20',
  nomatch:'the token reaches no business for this domain',
  suspended:'R-01: withdrawal detected, injection stopped, awaiting confirmation',
  nocache:'WP-I10: never claim "live" without confirmation',
  outage:'AIVIS down — last known good keeps serving',
};

let S = {};
function reset(mode){
  S = {
    mode,
    tab: mode === 'unconfigured' || mode === 'ambiguous' || mode === 'nomatch' ? 'settings' : 'status',
    connected: !['unconfigured','nomatch'].includes(mode),
    tokenSource: 'constant',
    business: mode === 'ambiguous' || mode === 'nomatch' ? null : 'biz_live',
    injection: true,
    interval: 15,
    cache: mode === 'nocache' ? 'none' : 'wp-super-cache',
    urls: baseUrls(),
    lastSync: mode === 'outage' ? '38 minutes ago' : '4 minutes ago',
    authoritative: mode !== 'outage',
    testing: false,
    testResult: null,
    pg: { state: '', lang: '', chain: '', search: '', page: 1, per: 20, orderby: 'url', order: 'asc' },
  };
  // The real screen opens on "Needs attention" whenever that view is non-empty.
  if (PAGES.filter(attentionOf).length > 0) S.pg.state = 'attention';
  if (mode === 'suspended') {
    const u = S.urls.find(u => u.url.includes('altes-angebot'));
    u.state = 'suspended';
    u.note = 'AIVIS returned "URL not found in your businesses" — injection stopped, cache purged, awaiting inventory confirmation';
  }
  if (mode === 'outage') S.urls.forEach(u => { if (u.state === 'active') u.note = 'Serving last known good — AIVIS unreachable since 09:42'; });
}

/* ── helpers ─────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host = u => { try { return new URL(u).host; } catch { return ''; } };
// The rebuild business only competes in the 'ambiguous' scenario; otherwise exactly one matches.
const matching = () => BUSINESSES.filter(b => host(b.baseUrl) === SITE_HOST && (S.mode === 'ambiguous' || b.id !== 'biz_rebuild'));
const biz = () => BUSINESSES.find(b => b.id === S.business);
const counts = () => ['active','stale','hold','suspended','retired']
  .reduce((a,k) => (a[k] = S.urls.filter(u => u.state === k).length, a), {});

const CHIP = {
  active:  ['c-active','Active'],
  stale:   ['c-stale','Stale'],
  hold:    ['c-hold','Holding last good'],
  suspended:['c-susp','Suspended'],
  retired: ['c-retired','Retired'],
};
const chip = s => `<span class="chip ${CHIP[s][0]}"><span class="dot"></span>${CHIP[s][1]}</span>`;

const CACHES = {
  'wp-super-cache': { label:'WP Super Cache', purge:'confirmed' },
  'w3-total-cache': { label:'W3 Total Cache', purge:'confirmed' },
  'litespeed':      { label:'LiteSpeed Cache', purge:'requested' },
  'wp-rocket':      { label:'WP Rocket', purge:'confirmed' },
  'none':           { label:'No supported cache plugin detected', purge:'unsupported' },
};

/* ── notices ─────────────────────────────────────────────── */
function notices(){
  const n = [];
  if (!S.connected && S.mode === 'unconfigured')
    n.push(['warning','<strong>AIVIS OS is not connected yet.</strong> Add an API token below to start delivering structured data. Nothing is injected until a business is bound.']);
  if (S.mode === 'ambiguous')
    n.push(['warning',`<strong>Two AIVIS businesses use ${SITE_HOST}.</strong> Pick the one this site should serve. Binding the wrong one would publish another business&rsquo;s structured data on these pages, with no visible error.`]);
  if (S.mode === 'nomatch')
    n.push(['error',`<strong>No AIVIS business matches ${SITE_HOST}.</strong> This token reaches ${BUSINESSES.length} businesses, none of them for this domain. Businesses on other domains are not offered — binding one would serve another site&rsquo;s data here.`]);
  if (S.mode === 'outage')
    n.push(['warning','<strong>AIVIS has been unreachable since 09:42.</strong> Every page keeps serving its last known good structured data. Nothing is removed while the API is unreachable — an outage costs freshness, never coverage.']);
  if (S.mode === 'suspended')
    n.push(['error','<strong>One page was withdrawn in AIVIS.</strong> Injection stopped for <code>/altes-angebot/</code> and its cache was purged. The row is kept until the next complete sync confirms the removal, in case the cause was a changed business selection rather than a withdrawal.']);
  if (S.mode === 'nocache')
    n.push(['warning','<strong>No supported cache plugin detected.</strong> Changed structured data is written locally, but the plugin cannot confirm your cache was purged, so it will not claim pages are live. Purge manually after a change, or use WP-CLI.']);
  if (S.connected && !S.injection)
    n.push(['warning','<strong>Injection is switched off.</strong> Artifacts keep syncing, but no structured data is added to any page.']);
  return n.map(([k,h]) => `<div class="notice notice-${k}"><p>${h}</p></div>`).join('');
}

/* ── the site's pages: 214 of them, the smallest customer ──── */
const SLUGS = ['leistungen','ueber-uns','kontakt','karriere','referenzen','blog','impressum','datenschutz','preise','faq','team','standorte','news','partner','downloads','support','shop','galerie','presse','agb'];
const SUB   = ['', 'beratung','planung','umsetzung','wartung','schulung','audit','strategie','design','entwicklung','betrieb'];
const MOVED = { 'https://example.com/ueber-uns/': 'https://example.com/ueber/', 'https://example.com/preise/': 'https://example.com/preise-2026/' };
function allPages(){
  const out = []; let i = 0;
  for (const sl of SLUGS) for (const sub of SUB) {
    i++;
    const en  = i % 5 === 0;
    const url = `https://example.com/${en ? 'en/' : ''}${sl}/${sub ? sub + '/' : ''}`;
    const state = i % 41 === 0 ? 'suspended' : i % 19 === 0 ? 'hold' : i % 9 === 0 ? 'stale' : i % 61 === 0 ? 'retired' : 'active';
    const day = 1 + (i % 6);
    out.push({
      url, lang: en ? 'en' : 'de', chain: en ? 'English site' : (i % 3 === 0 ? 'Editorial' : 'Structural core'),
      state,
      generated: state === 'hold' ? '—' : `${day} Sep 2026, ${String(8 + i % 10).padStart(2,'0')}:${String((i * 7) % 60).padStart(2,'0')}`,
      published: state === 'hold' ? '—' : `${day} Sep 2026`,
      seen: state === 'active' && i % 4 === 0 ? 'today' : state === 'active' ? 'yesterday' : '—',
      note: state === 'hold' ? 'Not generated yet in AIVIS — nothing injected, nothing removed'
          : state === 'stale' ? 'Source page changed after generation — still served'
          : state === 'suspended' ? 'AIVIS returned "URL not found in your businesses" — injection stopped, cache purged, awaiting inventory confirmation'
          : state === 'retired' ? 'Absent from two authoritative syncs — kept 30 days for rollback' : '',
    });
  }
  return out.slice(0, 214);
}
const PAGES = allPages();
const CONFLICTS = [];   // healthy: no other emitter on the sampled pages

const attentionOf = p => p.state === 'suspended' || p.state === 'hold' || p.state === 'inactive' || !!MOVED[p.url] || CONFLICTS.includes(p.url);
const VIEWS = [
  ['',          'All',                  () => PAGES.length],
  ['attention', 'Needs attention',      () => PAGES.filter(attentionOf).length],
  ['active',    'Injected',             () => PAGES.filter(p => p.state === 'active').length],
  ['stale',     'Stale but served',     () => PAGES.filter(p => p.state === 'stale').length],
  ['hold',      'Holding last good',    () => PAGES.filter(p => p.state === 'hold').length],
  ['suspended', 'Suspended',            () => PAGES.filter(p => p.state === 'suspended').length],
  ['retired',   'Retired',              () => PAGES.filter(p => p.state === 'retired').length],
  ['moved',     'Moved',                () => Object.keys(MOVED).length],
  ['conflict',  'Other JSON-LD on page',() => CONFLICTS.length],
];
const viewCount = key => (VIEWS.find(v => v[0] === key) || VIEWS[0])[2]();
const pageCounts = () => ({
  active: viewCount('active'), stale: viewCount('stale'), hold: viewCount('hold'),
  suspended: viewCount('suspended'), retired: viewCount('retired'), moved: viewCount('moved'), conflict: viewCount('conflict'),
});
const goPages = state => `data-act="gopages" data-state="${state}"`;

/* ── pages screen — WordPress's own list table ───────────────── */
function pagesScreen(){
  const q = S.pg;
  let rows = PAGES.filter(p => {
    if (q.state === 'attention') return attentionOf(p);
    if (q.state === 'moved') return !!MOVED[p.url];
    if (q.state === 'conflict') return CONFLICTS.includes(p.url);
    if (q.state) return p.state === q.state;
    return true;
  });
  if (q.lang)   rows = rows.filter(p => p.lang === q.lang);
  if (q.chain)  rows = rows.filter(p => p.chain === q.chain);
  if (q.search) rows = rows.filter(p => p.url.toLowerCase().includes(q.search.toLowerCase()));
  rows.sort((a, b) => (q.orderby === 'url' ? a.url.localeCompare(b.url) : a.generated.localeCompare(b.generated)) * (q.order === 'desc' ? -1 : 1));
  const total = rows.length, pages = Math.max(1, Math.ceil(total / q.per));
  q.page = Math.min(Math.max(1, q.page), pages);
  const slice = rows.slice((q.page - 1) * q.per, q.page * q.per);
  const pager = pos => `
    <div class="tablenav-pages ${pos}">
      <span class="displaying-num">${total} item${total === 1 ? '' : 's'}</span>
      <span class="pagination-links">
        <a class="button ${q.page === 1 ? 'disabled' : ''}" href="#" data-act="page" data-page="1">«</a>
        <a class="button ${q.page === 1 ? 'disabled' : ''}" href="#" data-act="page" data-page="${q.page - 1}">‹</a>
        <span class="paging-input">${q.page} of <span class="total-pages">${pages}</span></span>
        <a class="button ${q.page === pages ? 'disabled' : ''}" href="#" data-act="page" data-page="${q.page + 1}">›</a>
        <a class="button ${q.page === pages ? 'disabled' : ''}" href="#" data-act="page" data-page="${pages}">»</a>
      </span>
    </div>`;
  const sortLink = (key, label) => `<a href="#" data-act="sort" data-key="${key}">${label} <span class="sort-ind">${q.orderby === key ? (q.order === 'asc' ? '▲' : '▼') : ''}</span></a>`;

  return `
  <ul class="subsubsub">${VIEWS.filter(v => v[2]() > 0 || v[0] === '' || v[0] === 'attention').map(([key, label, count]) =>
    `<li><a href="#" class="${q.state === key ? 'current' : ''}" data-act="view" data-state="${key}">${label} <span class="count">(${count()})</span></a></li>`).join(' | ')}
  </ul>
  <p class="search-box">
    <input type="search" placeholder="Search pages…" value="${esc(q.search)}" data-act="search" aria-label="Search pages">
    <button class="button" data-act="searchgo">Search pages</button>
  </p>
  <div class="tablenav top">
    <div class="alignleft actions bulkactions">
      <select aria-label="Bulk action"><option>Bulk actions</option><option>Refresh from AIVIS now</option><option>Disable here</option><option>Restore</option></select>
      <button class="button action">Apply</button>
    </div>
    <div class="alignleft actions">
      <select data-act="flang" aria-label="Language"><option value="">All languages</option>${['de','en'].map(l => `<option value="${l}" ${q.lang === l ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select data-act="fchain" aria-label="Chain"><option value="">All chains</option>${CHAINS.map(c => `<option value="${esc(c.name)}" ${q.chain === c.name ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <button class="button" data-act="filter">Filter</button>
    </div>
    ${pager('top')}
  </div>
  <div class="scrollx">
  <table class="wp-list pages-table">
    <thead><tr>
      <th class="check-column"><input type="checkbox" aria-label="Select all"></th>
      <th class="col-page">${sortLink('url', 'Page')}</th><th>State</th><th>Language</th><th>Chain</th>
      <th>${sortLink('generated', 'Generated')}</th><th>Published</th><th>Seen on page</th>
    </tr></thead>
    <tbody>${slice.length === 0 ? `<tr><td colspan="8" class="muted">${q.state === 'attention'
        ? 'Nothing needs you. Every page is either injected as AIVIS generated it, or retired on purpose.' : 'No pages match.'}</td></tr>`
      : slice.map(p => `
      <tr>
        <td class="check-column"><input type="checkbox"></td>
        <td>
          <div class="url">${esc(p.url.replace('https://' + SITE_HOST, '') || '/')}</div>
          ${MOVED[p.url] ? `<div class="muted">now at <span class="url">${esc(MOVED[p.url].replace('https://' + SITE_HOST, ''))}</span></div>` : ''}
          ${p.note ? `<div class="muted" style="max-width:52ch">${esc(p.note)}</div>` : ''}
          <div class="row-actions">
            <button>Refresh now</button><span class="sepr">|</span>
            <button>${p.state === 'retired' ? 'Restore' : 'Disable here'}</button><span class="sepr">|</span>
            <button>Open page</button>
          </div>
        </td>
        <td>${chip(p.state)}</td>
        <td><code>${p.lang}</code></td>
        <td>${esc(p.chain)}</td>
        <td class="muted">${esc(p.generated)}</td>
        <td class="muted">${esc(p.published)}</td>
        <td class="muted">${esc(p.seen)}</td>
      </tr>`).join('')}
    </tbody>
  </table>
  </div>
  <div class="tablenav bottom">${pager('bottom')}</div>`;
}

    <h2>Status for AIVIS</h2>
    <div class="inside">
      <p>This plugin never sends anything to AIVIS. It keeps the status of publishing here — per page: what is published, with which
      content, since when, and when this site last saw it on the page — and AIVIS can fetch it from the endpoint below, presenting the key.</p>
      <table class="form-table">
        <tr><th scope="row">Endpoint</th><td><code>https://example.com/wp-json/aivis-os/v1/status</code><br>
          <span class="muted">Per-page detail at …/status/urls, paged by cursor. Read-only; GET only.</span></td></tr>
        <tr><th scope="row">Status key</th><td><code>aivis_status_k9Qw2…hT7</code>
          <p class="description">Enter this in AIVIS for this business. It is not the API token: it reaches nothing but the status document,
          which names this site&rsquo;s pages and their publishing state and never the token.</p>
          <p><button class="button">Regenerate</button> <button class="button button-link-delete">Disable</button></p></td></tr>
      </table>
    </div>
  </div>

  <div class="postbox">
    <h2>Delivery</h2>
    <div class="inside">
      <table class="form-table">
        <tr>
          <th scope="row">Injection</th>
          <td>
            <label class="check">
              <input type="checkbox" ${S.injection ? 'checked' : ''} data-act="inject">
              <span>Add AIVIS structured data to pages on this site
              <div class="description" style="margin-top:2px">One
              <code>&lt;script type="application/ld+json" data-aivis="1"&gt;</code> in the page head. Existing
              structured data from your theme or SEO plugin is never read or changed.</div></span>
            </label>
          </td>
        </tr>
        <tr>
          <th scope="row"><label for="iv">Check AIVIS for changes</label></th>
          <td>
            <select id="iv" data-act="interval">
              <option value="5"  ${S.interval == 5  ? 'selected' : ''}>Every 5 minutes</option>
              <option value="15" ${S.interval == 15 ? 'selected' : ''}>Every 15 minutes (recommended)</option>
              <option value="60" ${S.interval == 60 ? 'selected' : ''}>Hourly</option>
              <option value="0"  ${S.interval == 0  ? 'selected' : ''}>Manually only</option>
            </select>
            <p class="description">
              ${S.interval == 0
                ? 'With manual syncing, a page unpublished in AIVIS keeps being served here until you sync. Only choose this if you sync from WP-CLI or a system cron.'
                : `A page unpublished in AIVIS stops being served here within <strong>${S.interval} minutes plus your cache purge</strong>
                   while its pipeline is idle — up to ${S.interval * 2} minutes while a chain is rebuilding — plus any sync backlog shown on Status.
                   ${S.interval == 5 ? 'Five minutes needs a real system cron — WordPress&rsquo;s built-in cron only runs when someone visits the site.' : ''}`}
            </p>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <div class="postbox">
    <h2>Page cache</h2>
    <div class="inside">
      <table class="form-table">
        <tr>
          <th scope="row"><label for="ca">Cache plugin</label></th>
          <td>
            <select id="ca" data-act="cache">
              ${Object.entries(CACHES).map(([k,v]) => `<option value="${k}" ${S.cache === k ? 'selected' : ''}>${v.label}</option>`).join('')}
            </select>
            <p class="description">
              ${cache.purge === 'confirmed'
                ? 'Changed structured data purges the affected pages, and the plugin waits for confirmation before reporting them as live.'
                : cache.purge === 'requested'
                ? 'This plugin accepts purge requests but does not confirm them. Pages are reported as “purge requested”, never as confirmed live.'
                : 'Purge the affected pages yourself after a change. The plugin will keep saying pages are not confirmed live rather than claim something it cannot verify.'}
            </p>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <p style="margin-top:16px"><button class="button button-primary" data-act="save">Save changes</button></p>
  </form>`;
}

/* ── render + events ─────────────────────────────────────── */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1 class="wp-heading">${S.tab === 'pages' ? 'AIVIS OS — Pages' : 'AIVIS OS'}</h1>
    <p class="subtitle">${S.tab === 'pages'
      ? 'You do not have to read this list. "Needs attention" shows the pages that want a decision; search finds one page. Everything else is AIVIS delivering as generated.'
      : 'Delivers the structured data AIVIS generates for this site into its pages.'}</p>
    <nav class="nav-tab-wrapper">
      <button class="nav-tab ${S.tab === 'status' ? 'nav-tab-active' : ''}" data-tab="status">Status</button>
      <button class="nav-tab ${S.tab === 'pages' ? 'nav-tab-active' : ''}" data-tab="pages">Pages</button>
      <button class="nav-tab ${S.tab === 'settings' ? 'nav-tab-active' : ''}" data-tab="settings">Settings</button>
    </nav>
    ${S.tab === 'pages' ? '' : notices()}
    ${S.tab === 'status' ? statusScreen() : S.tab === 'pages' ? pagesScreen() : settingsScreen()}`;
  document.querySelectorAll('.submenu li').forEach(li =>
    li.classList.toggle('current', li.dataset.nav === S.tab));
  document.getElementById('stateHint').textContent = STATE_HINTS[S.mode] || '';
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { e.preventDefault(); S.tab = tab.dataset.tab; return render(); }
  const gp = e.target.closest('[data-act="gopages"]');
  if (gp) { e.preventDefault(); S.tab = 'pages'; S.pg.state = gp.dataset.state; S.pg.page = 1; return render(); }
  const vw = e.target.closest('[data-act="view"]');
  if (vw) { e.preventDefault(); S.pg.state = vw.dataset.state; S.pg.page = 1; return render(); }
  const pg = e.target.closest('[data-act="page"]');
  if (pg) { e.preventDefault(); S.pg.page = Number(pg.dataset.page) || 1; return render(); }
  const so = e.target.closest('[data-act="sort"]');
  if (so) { e.preventDefault(); if (S.pg.orderby === so.dataset.key) S.pg.order = S.pg.order === 'asc' ? 'desc' : 'asc'; else { S.pg.orderby = so.dataset.key; S.pg.order = 'asc'; } return render(); }
  if (e.target.closest('[data-act="filter"], [data-act="searchgo"]')) { S.pg.page = 1; return render(); }
  const nav = e.target.closest('.submenu li');
  if (nav) { e.preventDefault(); S.tab = nav.dataset.nav; return render(); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, i = el.dataset.i;
  if (act === 'inject')   { S.injection = el.checked; return render(); }
  if (act === 'usedb')    { S.tokenSource = 'option';   return render(); }
  if (act === 'useconst') { S.tokenSource = 'constant'; return render(); }
  if (act === 'pickbiz')  { S.business = el.value; return render(); }
  if (act === 'save')     { S.testResult = null; return render(); }
  if (act === 'test') {
    S.testing = true; render();
    setTimeout(() => { S.testing = false; S.testResult = S.mode === 'nomatch' ? 'ok' : 'ok'; render(); }, 700);
    return;
  }
  if (act === 'sync')    { S.lastSync = 'just now'; S.authoritative = true; return render(); }
  if (act === 'refresh') { const u = S.urls[i];
    if (u.state === 'suspended') { u.note = 'Re-checked just now — still withdrawn in AIVIS'; }
    else if (u.state === 'hold') { u.note = 'Re-checked just now — AIVIS has not generated this page yet'; }
    else { u.state = 'active'; u.generated = 'just now'; u.note = ''; }
    return render(); }
  if (act === 'toggle')  { const u = S.urls[i];
    u.state = u.state === 'retired' ? 'active' : 'retired';
    u.note = u.state === 'retired' ? 'Disabled on this site by an administrator' : 'Restored by an administrator';
    return render(); }
  if (act === 'view')    { alert('Opens a read-only view of the exact JSON-LD stored for\n' + S.urls[i].url); }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'flang')  { S.pg.lang = el.value; S.pg.page = 1; }
  if (el.dataset.act === 'fchain') { S.pg.chain = el.value; S.pg.page = 1; }
  if (el.dataset.act === 'search') { S.pg.search = el.value; S.pg.page = 1; render(); }
  if (el.dataset.act === 'interval') { S.interval = Number(el.value); render(); }
  if (el.dataset.act === 'cache')    { S.cache = el.value; render(); }
  if (el.dataset.act === 'inject')   { S.injection = el.checked; render(); }
});

document.getElementById('stateSelect').addEventListener('change', e => { reset(e.target.value); render(); });

const Q = new URLSearchParams(location.search);
reset(Q.get('state') || 'healthy');
document.getElementById('stateSelect').value = S.mode;
if (Q.get('screen')) S.tab = Q.get('screen');
if (Q.has('view')) { S.pg.state = Q.get('view'); }
if (Q.get('proto') === '0') document.querySelector('.proto').style.display = 'none';
render();
</script>
