name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        include:
          # Node 20 and 22 round-trip JSON correctly; on them the serializer
          # fidelity property MUST run and pass. Node 24+ carries the V8
          # JSON.parse defect in docs/KNOWN-ISSUES.md, so there the canary
          # warns and the property skips instead of blocking the PR.
          - node: '20'
            require_fidelity: '1'
          - node: '22'
            require_fidelity: '1'
    env:
      REQUIRE_FIDELITY: ${{ matrix.require_fidelity || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Hermetic on purpose: no network, no secrets, nothing to flake. A fork PR
      # runs exactly what a maintainer runs.
      - name: Unit tests
        run: npm run test:unit
      - name: Serializer properties and fuzz
        run: npm run test:serializer
      - name: Contract tests (mock API)
        run: npm run test:contract
      - name: Documentation is still machine-readable
        run: npm run check:docs

  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Syntax
        run: ./scripts/lint.sh
      - name: Install dev tooling
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: WordPress coding standards
        run: vendor/bin/phpcs -q --report=summary || true

  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/version-check.mjs
